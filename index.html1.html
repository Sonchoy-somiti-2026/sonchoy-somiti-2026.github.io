<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>সঞ্চয় সমিতি ২০২৬</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#14231c;--mu:#5d7068;--pr:#0f8a5f;--pr2:#0b6b49;--bd:#e0e8e3;--rd:#d64545;--am:#e0a020;--sh:0 4px 18px rgba(15,60,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1613;--card:#16211c;--tx:#e8f2ec;--mu:#92a89d;--pr:#2ecf93;--pr2:#1fa774;--bd:#243229;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1613;--card:#16211c;--tx:#e8f2ec;--mu:#92a89d;--pr:#2ecf93;--pr2:#1fa774;--bd:#243229;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#0b6b49,#14a671);color:#fff;padding:22px 16px 56px;text-align:center}
header h1{margin:0;font-size:26px}header p{margin:4px 0 0;opacity:.9;font-size:14px}
main{max-width:980px;margin:-36px auto 40px;padding:0 12px}
nav{display:flex;gap:6px;overflow-x:auto;background:var(--card);padding:6px;border-radius:14px;box-shadow:var(--sh);margin-bottom:14px}
nav button{flex:1 0 auto;border:0;background:none;color:var(--mu);padding:10px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pr);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.stat small{color:var(--mu)}.stat b{display:block;font-size:22px;color:var(--pr);margin-top:2px}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar h2{margin:0;font-size:18px}
.btn{border:0;background:var(--pr);color:#fff;padding:8px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.sm{padding:4px 10px;font-size:13px}.btn.ed{background:var(--am);color:#2a1d00}.btn.dl{background:var(--rd)}.btn.gh{background:var(--bd);color:var(--tx)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-weight:600}
td.a{white-space:nowrap;text-align:right}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:#d6f5e6;color:#0b6b49}.no{background:#fde2e2;color:#b02a2a}.wn{background:#fdf0cf;color:#8a6200}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.mt{color:var(--mu);font-size:13px}.empty{text-align:center;color:var(--mu);padding:22px}
.sync{font-size:12px;opacity:.85;margin-top:6px}
body:not(.admin) .adm{display:none!important}
.lg{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 12px;border-radius:99px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<header><button class="lg" id="lg">🔒 অ্যাডমিন লগইন</button><h1>🌿 সঞ্চয় সমিতি ২০২৬</h1><p>চাঁদা · বিনিয়োগ · লভ্যাংশের স্বচ্ছ হিসাব</p><div class="sync" id="sync"></div></header>
<main>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<dialog id="dlg"><form id="f" method="dialog"><h2 id="dt" style="margin:0 0 4px;font-size:18px"></h2><div id="fields"></div>
<div style="display:flex;gap:8px;margin-top:16px"><button type="button" class="btn" id="save" style="flex:1">সংরক্ষণ</button><button type="button" class="btn gh" id="cancel">বাতিল</button></div></form></dialog>
<dialog id="ldlg"><h2 style="margin:0 0 4px;font-size:18px">অ্যাডমিন লগইন</h2>
<label>ইমেইল</label><input id="em" type="email" autocomplete="username"><label>পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password">
<div id="lerr" class="mt" style="color:var(--rd)"></div>
<div style="display:flex;gap:8px;margin-top:16px"><button class="btn" id="lgo" style="flex:1">প্রবেশ</button><button class="btn gh" onclick="ldlg.close()">বাতিল</button></div></dialog>
<script>
const TABS=[["dash","ড্যাশবোর্ড"],["mem","সদস্য"],["sub","মাসিক চাঁদা"],["inv","বিনিয়োগ"],["pro","লভ্যাংশ"]];
let S={fee:1000,members:[],deposits:[],invests:[],profits:[]},tab="dash",month=new Date().toISOString().slice(0,7),dbDoc=null;
const $=id=>document.getElementById(id);
const bn=n=>Number(n||0).toLocaleString("bn-BD",{maximumFractionDigits:2});
const tk=n=>"৳ "+bn(n);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mname=m=>{if(!m)return"";const[y,mo]=m.split("-");return new Date(y,mo-1,1).toLocaleDateString("bn-BD",{year:"numeric",month:"long"})};
const sum=a=>a.reduce((t,x)=>t+Number(x.amount||0),0);
const memName=id=>(S.members.find(m=>m.id===id)||{}).name||"—";

window.setState=d=>{S=Object.assign({fee:1000,members:[],deposits:[],invests:[],profits:[]},d);render()};

function persist(){
  if(window.saveRemote)window.saveRemote(JSON.stringify(S)).then(()=>$("sync").textContent="✓ সংরক্ষিত হয়েছে").catch(()=>$("sync").textContent="⚠ সংরক্ষণ হয়নি, আবার লগইন করুন");
  render();
}

/* ---------- forms ---------- */
const FORMS={
 mem:{t:"সদস্য",k:"members",f:[["name","নাম","text"],["phone","মোবাইল","tel"]]},
 sub:{t:"মাসিক চাঁদা",k:"deposits",f:[["mid","সদস্য","member"],["month","মাস","month"],["amount","পরিমাণ (টাকা)","number"],["date","জমার তারিখ","date"]]},
 inv:{t:"বিনিয়োগ",k:"invests",f:[["title","ব্যবসা / খাতের নাম","text"],["amount","বিনিয়োগের পরিমাণ (টাকা)","number"],["date","তারিখ","date"],["status","অবস্থা","status"],["note","মন্তব্য","text"]]},
 pro:{t:"লভ্যাংশ",k:"profits",f:[["title","উৎস (কোন ব্যবসা)","text"],["month","মাস","month"],["amount","মোট লভ্যাংশ (টাকা)","number"],["note","মন্তব্য","text"]]}
};
function openForm(type,id,pre){
  const F=FORMS[type],rec=id?S[F.k].find(x=>x.id===id):Object.assign({},pre||{});
  $("dt").textContent=(id?"সম্পাদনা: ":"নতুন যোগ: ")+F.t;
  $("fields").innerHTML=F.f.map(([n,l,t])=>{
    const v=rec[n]??"";let inp;
    if(t==="member")inp=`<select name="${n}">${S.members.map(m=>`<option value="${m.id}" ${m.id===v?"selected":""}>${esc(m.name)}</option>`).join("")}</select>`;
    else if(t==="status")inp=`<select name="${n}">${["চলমান","সম্পন্ন","ক্ষতি"].map(s=>`<option ${s===v?"selected":""}>${s}</option>`).join("")}</select>`;
    else inp=`<input name="${n}" type="${t}" value="${esc(v)}">`;
    return `<label>${l}</label>${inp}`}).join("");
  $("save").onclick=()=>{
    const d={};$("fields").querySelectorAll("[name]").forEach(e=>d[e.name]=e.value);
    if(type==="mem"&&!d.name.trim())return alert("নাম লিখুন");
    if(["sub","inv","pro"].includes(type)&&!(Number(d.amount)>0))return alert("সঠিক পরিমাণ দিন");
    if(type==="sub"&&!d.mid)return alert("আগে সদস্য যোগ করুন");
    if(["amount"].some(k=>k in d))d.amount=Number(d.amount);
    if(id)Object.assign(rec,d);else S[F.k].push(Object.assign({id:uid()},d));
    $("dlg").close();persist();
  };
  $("dlg").showModal();
}
$("cancel").onclick=()=>$("dlg").close();
function del(type,id){if(confirm("মুছে ফেলতে চান?")){const k=FORMS[type].k;S[k]=S[k].filter(x=>x.id!==id);persist()}}
const acts=(t,id)=>`<td class="a adm"><button class="btn sm ed adm" onclick="openForm('${t}','${id}')">✏️ এডিট</button> <button class="btn sm dl" onclick="del('${t}','${id}')">🗑</button></td>`;

/* ---------- views ---------- */
const V={
dash(){
  const dep=sum(S.deposits),inv=sum(S.invests),pro=sum(S.profits),paid=S.deposits.filter(d=>d.month===month).length;
  return `<div class="grid">
   <div class="stat"><small>মোট সদস্য</small><b>${bn(S.members.length)} জন</b></div>
   <div class="stat"><small>মোট জমাকৃত চাঁদা</small><b>${tk(dep)}</b></div>
   <div class="stat"><small>মোট বিনিয়োগ</small><b>${tk(inv)}</b></div>
   <div class="stat"><small>মোট লভ্যাংশ</small><b>${tk(pro)}</b></div>
   <div class="stat"><small>হাতে থাকা তহবিল</small><b>${tk(dep+pro-inv)}</b></div>
   <div class="stat"><small>${mname(month)} এ চাঁদা দিয়েছেন</small><b>${bn(paid)}/${bn(S.members.length)}</b></div></div>
   <div class="card"><div class="bar"><h2>সদস্যভিত্তিক সারসংক্ষেপ</h2></div>${memTable()}</div>`},
mem(){return `<div class="card"><div class="bar"><h2>সদস্য তালিকা</h2><button class="btn adm" onclick="openForm('mem')">➕ সদস্য যোগ</button></div>
  ${S.members.length?`<div class="tw"><table><tr><th>#</th><th>নাম</th><th>মোবাইল</th><th></th></tr>${S.members.map((m,i)=>`<tr><td>${bn(i+1)}</td><td>${esc(m.name)}</td><td>${esc(m.phone)}</td>${acts("mem",m.id)}</tr>`).join("")}</table></div>`:'<div class="empty">এখনো কোনো সদস্য নেই। উপরের বাটনে চাপ দিয়ে যোগ করুন।</div>'}</div>`},
sub(){
  const rows=S.members.map(m=>{const d=S.deposits.filter(x=>x.mid===m.id&&x.month===month),p=sum(d),due=Math.max(0,S.fee-p);
   const st=p>=S.fee?'<span class="tag ok">পরিশোধিত</span>':p>0?'<span class="tag wn">আংশিক</span>':'<span class="tag no">বাকি</span>';
   return `<tr><td>${esc(m.name)}</td><td>${tk(p)}</td><td>${due?tk(due):"—"}</td><td>${st}</td><td class="a adm">${d[0]?`<button class="btn sm ed adm" onclick="openForm('sub','${d[0].id}')">✏️ এডিট</button> `:""}<button class="btn sm adm" onclick="openForm('sub',null,{mid:'${m.id}',month:'${month}',amount:${due||S.fee},date:'${new Date().toISOString().slice(0,10)}'})">+ জমা</button></td></tr>`}).join("");
  const list=S.deposits.filter(d=>d.month===month);
  return `<div class="card"><div class="bar"><h2>মাসিক চাঁদা</h2><div style="display:flex;gap:8px;align-items:center"><input type="month" value="${month}" onchange="month=this.value;render()" style="width:auto"></div></div>
   <div class="bar mt">নির্ধারিত মাসিক চাঁদা: <b>${tk(S.fee)}</b> <button class="btn sm gh adm" onclick="setFee()">✏️ পরিবর্তন</button></div>
   ${S.members.length?`<div class="tw"><table><tr><th>সদস্য</th><th>জমা</th><th>বাকি</th><th>অবস্থা</th><th></th></tr>${rows}</table></div>`:'<div class="empty">আগে “সদস্য” ট্যাবে সদস্য যোগ করুন।</div>'}
   <div class="mt" style="margin-top:10px">${mname(month)} মাসে মোট আদায়: <b>${tk(sum(list))}</b></div></div>
   ${list.length?`<div class="card"><div class="bar"><h2>জমার তালিকা</h2></div><div class="tw"><table><tr><th>সদস্য</th><th>তারিখ</th><th>পরিমাণ</th><th></th></tr>${list.map(d=>`<tr><td>${esc(memName(d.mid))}</td><td>${esc(d.date)}</td><td>${tk(d.amount)}</td>${acts("sub",d.id)}</tr>`).join("")}</table></div></div>`:""}`},
inv(){return `<div class="card"><div class="bar"><h2>ব্যবসায় বিনিয়োগ</h2><button class="btn adm" onclick="openForm('inv')">➕ নতুন বিনিয়োগ</button></div>
  ${S.invests.length?`<div class="tw"><table><tr><th>খাত</th><th>তারিখ</th><th>পরিমাণ</th><th>অবস্থা</th><th>মন্তব্য</th><th></th></tr>${S.invests.map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.date)}</td><td>${tk(i.amount)}</td><td><span class="tag ${i.status==="সম্পন্ন"?"ok":i.status==="ক্ষতি"?"no":"wn"}">${esc(i.status)}</span></td><td>${esc(i.note)}</td>${acts("inv",i.id)}</tr>`).join("")}</table></div><div class="mt" style="margin-top:10px">মোট বিনিয়োগ: <b>${tk(sum(S.invests))}</b></div>`:'<div class="empty">কোনো বিনিয়োগ যোগ করা হয়নি।</div>'}</div>`},
pro(){const n=S.members.length||1;
  return `<div class="card"><div class="bar"><h2>মাসিক লভ্যাংশ</h2><button class="btn adm" onclick="openForm('pro')">➕ লভ্যাংশ জমা</button></div>
  ${S.profits.length?`<div class="tw"><table><tr><th>মাস</th><th>উৎস</th><th>মোট</th><th>জনপ্রতি অংশ</th><th>মন্তব্য</th><th></th></tr>${S.profits.slice().sort((a,b)=>(b.month||"").localeCompare(a.month||"")).map(p=>`<tr><td>${mname(p.month)}</td><td>${esc(p.title)}</td><td>${tk(p.amount)}</td><td>${tk(p.amount/n)}</td><td>${esc(p.note)}</td>${acts("pro",p.id)}</tr>`).join("")}</table></div><div class="mt" style="margin-top:10px">মোট লভ্যাংশ: <b>${tk(sum(S.profits))}</b> · জনপ্রতি (সমান ভাগে): <b>${tk(sum(S.profits)/n)}</b></div>`:'<div class="empty">এখনো কোনো লভ্যাংশ জমা হয়নি।</div>'}</div>`}
};
function memTable(){
  if(!S.members.length)return'<div class="empty">সদস্য যোগ করলে এখানে হিসাব দেখা যাবে।</div>';
  const share=sum(S.profits)/S.members.length;
  return `<div class="tw"><table><tr><th>সদস্য</th><th>মোট জমা</th><th>লভ্যাংশ অংশ</th><th>মোট</th></tr>${S.members.map(m=>{const d=sum(S.deposits.filter(x=>x.mid===m.id));return `<tr><td>${esc(m.name)}</td><td>${tk(d)}</td><td>${tk(share)}</td><td><b>${tk(d+share)}</b></td></tr>`}).join("")}</table></div>`}
function setFee(){const v=prompt("মাসিক চাঁদার পরিমাণ (টাকা):",S.fee);if(v!==null&&Number(v)>0){S.fee=Number(v);persist()}}
function render(){
  $("nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("");
  $("view").innerHTML=V[tab]();
}
render();

</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,onSnapshot,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
/* ====== এখানে নিজের Firebase তথ্য বসান ====== */
const firebaseConfig={apiKey:"AIzaSyD4Wm-KW3ZuaL3oyDxskz2LM_7cZk29apk",authDomain:"sonchoy-somiti-2026.firebaseapp.com",projectId:"sonchoy-somiti-2026",appId:"1:290167111282:web:7a92dadc49c4041525cceb"};
const ADMIN_EMAIL="mdmahmodulhasanmobin123456@gmail.com";
/* ============================================ */
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),ref=doc(db,"society","state");
onSnapshot(ref,s=>{if(s.exists())window.setState(JSON.parse(s.data().json));document.getElementById("sync").textContent="✓ লাইভ"},()=>{document.getElementById("sync").textContent="⚠ সংযোগ হয়নি (Firebase তথ্য ঠিক আছে?)"});
window.saveRemote=j=>setDoc(ref,{json:j});
const lg=document.getElementById("lg");
onAuthStateChanged(auth,u=>{const ok=!!u&&u.email===ADMIN_EMAIL;document.body.classList.toggle("admin",ok);lg.textContent=ok?"🔓 লগআউট":"🔒 অ্যাডমিন লগইন";lg.onclick=ok?()=>signOut(auth):()=>{document.getElementById("lerr").textContent="";document.getElementById("ldlg").showModal()}});
document.getElementById("lgo").onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById("em").value.trim(),document.getElementById("pw").value);document.getElementById("ldlg").close()}catch(e){document.getElementById("lerr").textContent="ইমেইল বা পাসওয়ার্ড ভুল"}};
</script>
</body>
