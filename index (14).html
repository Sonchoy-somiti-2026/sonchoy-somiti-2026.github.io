<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>সঞ্চয় সমিতি ২০২৬</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b6b49"><link rel="apple-touch-icon" href="icon-512.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="সঞ্চয় সমিতি">
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#14231c;--mu:#5d7068;--pr:#0f8a5f;--pr2:#0b6b49;--bd:#e0e8e3;--rd:#d64545;--am:#e0a020;--sh:0 4px 18px rgba(15,60,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1613;--card:#16211c;--tx:#e8f2ec;--mu:#92a89d;--pr:#2ecf93;--pr2:#1fa774;--bd:#243229;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1613;--card:#16211c;--tx:#e8f2ec;--mu:#92a89d;--pr:#2ecf93;--pr2:#1fa774;--bd:#243229;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff,"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif);font-size:var(--fs,16px);line-height:1.5}
header{background:linear-gradient(135deg,var(--g1,#0b6b49),var(--g2,#14a671));color:#fff;padding:22px 16px 56px;text-align:center}
header h1{margin:0;font-size:var(--ts,30px)}header p{margin:4px 0 0;opacity:.9;font-size:14px}
main{max-width:980px;margin:-36px auto 40px;padding:0 12px}
nav{display:flex;gap:6px;overflow-x:auto;background:var(--card);padding:6px;border-radius:14px;box-shadow:var(--sh);margin-bottom:14px}
nav button{flex:1 0 auto;border:0;background:none;color:var(--mu);padding:10px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pr);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.stat small{color:var(--mu)}.stat b{display:block;font-size:22px;color:var(--pr);margin-top:2px}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar h2{margin:0;font-size:18px}
.btn{border:0;background:var(--pr);color:#fff;padding:8px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.sm{padding:4px 10px;font-size:13px}.btn.ed{background:var(--am);color:#2a1d00}.btn.dl{background:var(--rd)}.btn.gh{background:var(--bd);color:var(--tx)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:.9em}th{color:var(--mu);font-weight:600}
td.a{white-space:nowrap;text-align:right}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:#d6f5e6;color:#0b6b49}.no{background:#fde2e2;color:#b02a2a}.wn{background:#fdf0cf;color:#8a6200}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.mt{color:var(--mu);font-size:13px}.empty{text-align:center;color:var(--mu);padding:22px}
.sync{font-size:12px;opacity:.85;margin-top:6px}
body:not(.admin) .adm,body:not(.admin) .lg{display:none!important}
.lg{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 12px;border-radius:99px;font:inherit;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--g1,#0b6b49),var(--g2,#14a671) 55%,#d9a21b);color:#fff;border-radius:22px;padding:36px 22px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero:before{content:"🌿";position:absolute;font-size:200px;right:-24px;top:-40px;opacity:.15}
.hero h2{font-size:var(--ts,30px);margin:0 0 10px;line-height:1.3}.hero p{max-width:640px;margin:0;opacity:.96;font-size:16px}
.hs{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hs div{background:rgba(255,255,255,.2);padding:10px 16px;border-radius:14px;font-size:13px}.hs b{display:block;font-size:21px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
ol.rl{padding-left:22px;margin:0}ol.rl li{padding:6px 0;border-bottom:1px dashed var(--bd)}
a.ml{color:var(--pr);font-weight:600;text-decoration:none}
.pt{display:none}
.sig{display:none;justify-content:space-around;gap:16px;margin-top:46px;text-align:center}.sig>div{flex:1}.sig .sl{border-top:1px solid currentColor;margin-bottom:6px}.sig b{display:block;min-height:1.5em}.sig small{display:block;color:var(--mu)}
@media print{.sig{display:flex!important}body.rprint #app,body.rprint #gate{display:none!important}body.rprint #rov{position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--g1,#0b6b49),var(--g2,#14a671))}
.gbox{background:var(--card);border-radius:20px;padding:26px;width:min(380px,100%);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}.gbox .logo{box-shadow:none;border:1px solid var(--bd)}.gerr{color:var(--rd);min-height:20px;margin-top:8px;font-size:.9em}
body.in #gate,body.ready #gw{display:none}body:not(.in) #app{display:none}body:not(.ready) #gf{display:none}
.mbar{display:flex;align-items:center;gap:12px;background:var(--pr);color:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--sh);margin-bottom:14px}.mbar button{background:rgba(0,0,0,.25);color:#fff;border:0;border-radius:10px;width:46px;height:42px;font-size:22px;cursor:pointer}.mbar span{font-weight:700;font-size:1.08em}
.menu{display:none;background:var(--card);border-radius:14px;box-shadow:var(--sh);margin:-6px 0 14px;overflow:hidden}.menu.open{display:block}.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);padding:14px 16px;font:inherit;font-weight:600;cursor:pointer}.menu button.on{background:var(--pr);color:#fff}.menu button:last-child{border:0}.menu button.lk{justify-content:center;color:var(--mu);opacity:.75;font-size:1.15em;padding:10px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:14px}.cm{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.av{width:54px;height:54px;border-radius:50%;background:var(--bd);color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:1.5em;object-fit:cover;flex:none}.ci{flex:1;min-width:120px}.ci b{display:block}.ci small{display:block;color:var(--mu)}.cb{width:100%;display:flex;gap:6px;justify-content:flex-end}
@media print{.cm{box-shadow:none;border:1px solid #ccc;break-inside:avoid}.cb{display:none!important}}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}.mc{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;position:relative}.mc small{display:block;color:var(--mu)}.mc b{font-size:.92em}.mc.on{background:var(--pr);color:#fff;border-color:var(--pr)}.mc.on small{color:#fff;opacity:.85}.mc i{position:absolute;top:6px;right:8px;font-size:11px;font-style:normal;background:var(--am);color:#2a1d00;padding:0 7px;border-radius:99px}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ch{padding:4px 10px;border-radius:99px;font-size:.82em;border:1px solid var(--bd);color:var(--mu)}.ch.c1{background:var(--pr);color:#fff;border-color:var(--pr)}.ch.c2{background:#fdf0cf;color:#8a6200;border-color:#e0a020}
.ch.c3{background:#1565c0;color:#fff;border-color:#1565c0}.sg{display:flex;gap:8px;margin-top:10px}.sg i{width:16px;height:16px;border-radius:50%;display:block}
.mbar .tg{margin-left:auto}
.rg{display:flex;gap:14px;align-items:center;margin-top:6px;flex-wrap:wrap}.rg svg text{font-family:inherit}
.pb{height:10px;border-radius:99px;background:var(--bd);margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;background:var(--pr)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--bd);cursor:pointer;margin:4px 6px 0 0}
input[type=range]{padding:0}
@media print{:root:not([data-x]){--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#ccc;--pr:#0b6b49}header,nav,.mbar,.menu,.adm,.noprint,.sync{display:none!important}.pt{display:block;text-align:center;margin-bottom:10px}main{margin:0}.card,.stat{box-shadow:none;border:1px solid #ccc}.stat{break-inside:avoid}tr{break-inside:avoid}.tw{overflow:visible}}
.logo{width:104px;height:104px;object-fit:contain;background:#fff;border-radius:50%;padding:6px;margin-bottom:8px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="gate"><div class="gbox"><img class="logo" id="gl" alt=""><h2 style="margin:6px 0 2px">সদস্য লগইন</h2>
<div id="gw" class="mt">⏳ লোড হচ্ছে...</div>
<div id="gf"><p class="mt" id="gp" style="margin:0 0 12px">সদস্য পাসওয়ার্ড দিন</p><input id="gid" type="email" placeholder="অ্যাডমিন ইমেইল" autocomplete="username" style="display:none;margin-bottom:10px"><input id="gpw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
<div id="gerr" class="gerr"></div><button class="btn" id="gbtn" style="width:100%;margin-top:10px">প্রবেশ</button><p class="mt" style="margin:14px 0 0">পাসওয়ার্ড না জানলে অ্যাডমিনের সাথে যোগাযোগ করুন।</p><a href="#" id="gad" style="display:inline-block;margin-top:12px;font-size:.85em;color:var(--mu);opacity:.75">অ্যাডমিন</a></div></div></div>
<div id="app"><header><img class="logo" id="hl" alt="লোগো"><h1 id="st"></h1><p id="ss"></p><div class="sync" id="sync"></div></header>
<main>
<div class="mbar"><button onclick="toggleMenu()" aria-label="মেনু">☰</button><span id="mt"></span><button class="tg" id="tg" onclick="toggleTheme()" aria-label="থিম">🌙</button></div><div id="menu" class="menu"></div>
<div id="view"></div>
</main></div>
<dialog id="dlg"><form id="f" method="dialog"><h2 id="dt" style="margin:0 0 4px;font-size:18px"></h2><div id="fields"></div>
<div style="display:flex;gap:8px;margin-top:16px"><button type="button" class="btn" id="save" style="flex:1">সংরক্ষণ</button><button type="button" class="btn gh" id="cancel">বাতিল</button></div></form></dialog>

function openForm(type,id,pre){phTmp=undefined;
  const F=FORMS[type],rec=id?S[F.k].find(x=>x.id===id):Object.assign({},pre||{});
  $("dt").textContent=(id?"সম্পাদনা: ":"নতুন যোগ: ")+F.t;
  $("fields").innerHTML=F.f.map(([n,l,t])=>{
    const v=(type==="com"&&n==="phone"&&id?(P.com||{})[id]:rec[n])??"";let inp;
    if(t==="photo"){const cu=id?PH[id]:"";inp=`<input type="file" accept="image/*" onchange="pickPh(this)"><div style="margin-top:8px;display:flex;align-items:center;gap:10px"><img id="pv" class="av" ${cu?`src="${cu}"`:'style="display:none"'}><button type="button" class="btn sm dl" onclick="rmPh()">ছবি সরান</button></div>`}else if(t==="member")inp=`<select name="${n}">${S.members.map(m=>`<option value="${m.id}" ${m.id===v?"selected":""}>${esc(m.name)}</option>`).join("")}</select>`;
    else if(t==="status")inp=`<select name="${n}">${["চলমান","সম্পন্ন","ক্ষতি"].map(s=>`<option ${s===v?"selected":""}>${s}</option>`).join("")}</select>`;
    else inp=`<input name="${n}" type="${t}" value="${esc(v)}">`;
    return `<label>${l}</label>${inp}`}).join("");
  $("save").onclick=()=>{
    const d={};$("fields").querySelectorAll("[name]").forEach(e=>d[e.name]=e.value);
    if(["mem","com"].includes(type)&&!d.name.trim())return alert("নাম লিখুন");
    if(["sub","inv","pro"].includes(type)&&!(Number(d.amount)>0))return alert("সঠিক পরিমাণ দিন");
    if(type==="sub"&&!d.mid)return alert("আগে সদস্য যোগ করুন");
    if(["amount"].some(k=>k in d))d.amount=Number(d.amount);
    let rid=id;if(id)Object.assign(rec,d);else{rid=uid();S[F.k].push(Object.assign({id:rid},d))}
    if(type==="com"){const r=S.committee.find(x=>x.id===rid);P.com=P.com||{};P.com[rid]=r.phone||"";delete r.phone;savePriv().catch(()=>{});if(phTmp!==undefined){if(phTmp)PH[rid]=phTmp;else delete PH[rid];savePhotos().catch(()=>{})}}
    $("dlg").close();persist();
  };
  $("dlg").showModal();
}
$("cancel").onclick=()=>$("dlg").close();
